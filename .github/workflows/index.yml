name: Обновить список дополнений
on:
  push:
    paths: ['addons/adofire/**', 'addons/adocho/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make-index.py
      - name: Коммит index.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add addons/index.json
          git diff --cached --quiet || (git commit -m "Обновить addons/index.json" && git push)
          
