name: Build Kopi KD extensions

on:
  push:
    branches: [main]
    paths:
      - "src/kopi/**"
      - "tools/build-kd.py"
      - ".github/workflows/build-kd.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build .kd archives
        run: python tools/build-kd.py
      - name: Commit packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/kopi/*.kd
          if git diff --cached --quiet; then
            echo "No package changes."
          else
            git commit -m "Build Kopi .kd extensions"
            git push
          fi
